name: RDP

on:
workflow_dispatch:

permissions:
contents: read

jobs:
secure-rdp:
runs-on: windows-latest
timeout-minutes: 360

steps:
  - name: Configure Core RDP Settings
    shell: powershell
    run: |
      $ErrorActionPreference = "Stop"

      Set-ItemProperty `
        -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
        -Name 'fDenyTSConnections' -Value 0 -Force

      Set-ItemProperty `
        -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
        -Name 'UserAuthentication' -Value 1 -Force

      Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

      Write-Host "RDP settings configured with Network Level Authentication."

  - name: Validate Required Secrets
    shell: powershell
    env:
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
    run: |
      $ErrorActionPreference = "Stop"

      if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
        throw "Missing GitHub Actions secret: TAILSCALE_AUTH_KEY"
      }

      if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
        throw "Missing GitHub Actions secret: RDP_PASSWORD"
      }

      Write-Host "Required secrets are configured."

  - name: Create RDP User
    shell: powershell
    env:
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
    run: |
      $ErrorActionPreference = "Stop"

      $username = "TOOLBOXLAP"
      $securePass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
      $user = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

      if (-not $user) {
        New-LocalUser `
          -Name $username `
          -Password $securePass `
          -AccountNeverExpires `
          -Description "RDP account"
      } else {
        Set-LocalUser -Name $username -Password $securePass
      }

      Add-LocalGroupMember `
        -Group "Remote Desktop Users" `
        -Member $username `
        -ErrorAction SilentlyContinue

      if (-not (Get-LocalUser -Name $username)) {
        throw "RDP user creation failed."
      }

      Write-Host "RDP user created or updated."

  - name: Install Tailscale
    shell: powershell
    run: |
      $ErrorActionPreference = "Stop"

      $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
      $installerPath = Join-Path $env:TEMP "tailscale.msi"

      Invoke-WebRequest `
        -Uri $tsUrl `
        -OutFile $installerPath `
        -ErrorAction Stop

      $arguments = "/i `"$installerPath`" /quiet /norestart"
      $process = Start-Process `
        -FilePath "msiexec.exe" `
        -ArgumentList $arguments `
        -Wait `
        -PassThru

      Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

      if ($process.ExitCode -notin @(0, 3010)) {
        throw "Tailscale MSI installation failed: exit code $($process.ExitCode)"
      }

      $tailscaleExe = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"

      if (-not (Test-Path $tailscaleExe)) {
        throw "Tailscale executable not found: $tailscaleExe"
      }

      Write-Host "Tailscale installed successfully."

  - name: Connect to Tailscale
    shell: powershell
    env:
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
    run: |
      $ErrorActionPreference = "Stop"

      $tailscaleExe = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"

      Start-Service -Name Tailscale -ErrorAction SilentlyContinue

      & $tailscaleExe up `
        --authkey="$env:TAILSCALE_AUTH_KEY" `
        --hostname="gh-runner-$env:GITHUB_RUN_ID"

      if ($LASTEXITCODE -ne 0) {
        throw "Tailscale failed to connect."
      }

      $tsIP = $null

      for ($i = 0; $i -lt 12; $i++) {
        $ips = & $tailscaleExe ip -4

        if ($LASTEXITCODE -eq 0 -and $ips) {
          $tsIP = ($ips | Select-Object -First 1).Trim()
          if ($tsIP) { break }
        }

        Start-Sleep -Seconds 5
      }

      if (-not $tsIP) {
        throw "No Tailscale IPv4 address assigned."
      }

      "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      Write-Host "Tailscale connection established."

  - name: Verify RDP Service
    shell: powershell
    run: |
      $ErrorActionPreference = "Stop"

      $service = Get-Service -Name TermService

      if ($service.Status -ne "Running") {
        Start-Service -Name TermService
      }

      $listener = Get-NetTCPConnection `
        -LocalPort 3389 `
        -State Listen `
        -ErrorAction SilentlyContinue

      if (-not $listener) {
        throw "RDP is not listening on TCP port 3389."
      }

      Write-Host "RDP service is listening on port 3389."
      Write-Host "Tailscale IP: $env:TAILSCALE_IP"

  - name: Finish
    shell: powershell
    run: |
      Write-Host "Configuration and service checks completed."
      Write-Host "The GitHub-hosted runner is temporary."
